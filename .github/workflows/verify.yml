name: Verify source and native driver
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Execute installer recovery tests in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installer-recovery.ps1 -RequireWindowsPowerShell51
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Fetch pinned official WDK build dependencies
        shell: pwsh
        run: ./scripts/fetch-wdk.ps1
      - name: Build driver core
        run: cargo build --release --locked -p scx-vpad-core --no-default-features --target-dir target/driver-core
      - name: Build and validate UMDF package
        shell: pwsh
        run: ./scripts/build-driver.ps1 -RustLibrary ./target/driver-core/release/scx_vpad_core.lib

