name: Verify source and native driver
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Verify isolated Rust Source Guard policy
        run: |
          cargo fmt --manifest-path isolation/policy/Cargo.toml -- --check
          cargo test --manifest-path isolation/policy/Cargo.toml --locked
          cargo clippy --manifest-path isolation/policy/Cargo.toml --all-targets --locked -- -D warnings
      - name: Execute installer recovery tests in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-installer-recovery.ps1 -RequireWindowsPowerShell51
      - name: Verify Sony GameInput mappings and registry recovery
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test-gameinput-mappings.ps1
      - name: Verify package safety, service configuration and replacement identities
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          ./scripts/test-package-validation.ps1 -RequireWindowsPowerShell51
          ./scripts/test-service-configuration.ps1
          ./scripts/test-setup-identity.ps1 -RequireWindowsPowerShell51
          ./isolation/Test-SourceModels.ps1
  driver:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component rust-docs
      - name: Fetch pinned official WDK build dependencies
        shell: pwsh
        run: ./scripts/fetch-wdk.ps1
      - name: Fetch pinned Rust dependencies
        run: cargo fetch --locked
      - name: Build and validate complete UMDF and Source Guard package
        shell: pwsh
        run: ./scripts/build-package.ps1 -IncludeSourceGuard -SourceModelFile ./isolation/models-qualified.txt -Destination ./artifacts/package
      - name: Build and regression-test graphical Setup without installation
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/package/* -DestinationPath ./artifacts/package.zip
          $digest = (Get-FileHash ./artifacts/package.zip -Algorithm SHA256).Hash
          ./scripts/build-setup.ps1 -PackageZip ./artifacts/package.zip -ExpectedSha256 $digest -OutputDirectory ./artifacts/setup
          ./scripts/test-setup.ps1 -PackageZip ./artifacts/package.zip -BuildDirectory ./artifacts/setup
      - name: Verify actual Source Guard fail-fast handler in isolated child
        shell: pwsh
        run: ./isolation/policy/Test-Panic.ps1
      - name: Build independent Windows Gaming Input diagnostic
        shell: pwsh
        run: ./scripts/build-wgi-probe.ps1

