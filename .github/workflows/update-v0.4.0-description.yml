name: Update v0.4.0 release transparency notice
on:
  push:
    branches: [release/v0.4.0-description]
permissions: {}
jobs:
  update-description:
    if: github.repository == 'syrrath-creator/SCX-VPad' && github.ref == 'refs/heads/release/v0.4.0-description' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Update description only and verify unchanged release assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $plan = Get-Content -LiteralPath 'release-description/v0.4.0.json' -Raw | ConvertFrom-Json
          if ($plan.releaseId -ne 439353012 -or $plan.tag -cne 'v0.4.0' -or $plan.targetCommit -cne 'cb1c409586b5c530833ab99a3bc2acc4fc29995f') { throw 'Unexpected update target.' }
          $headers = @{ Authorization = ('Bearer ' + $env:GITHUB_TOKEN); Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28'; 'User-Agent' = 'SCX-release-description-update' }
          $api = 'https://api.github.com/repos/syrrath-creator/SCX-VPad'
          $url = $api + '/releases/439353012'
          $before = Invoke-RestMethod -Uri $url -Headers $headers -MaximumRedirection 0
          $tagBefore = Invoke-RestMethod -Uri ($api + '/git/ref/tags/v0.4.0') -Headers $headers -MaximumRedirection 0
          if ($before.tag_name -cne $plan.tag -or $before.name -cne $plan.title -or $before.draft -or $before.prerelease -or $tagBefore.object.sha -cne $plan.targetCommit) { throw 'Release identity changed.' }
          $assetSnapshot = @($before.assets | Sort-Object id | Select-Object id,name,size,digest,state) | ConvertTo-Json -Depth 4 -Compress
          if ($before.body -cne $plan.body) {
            $oldHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($before.body))).ToLowerInvariant()
            if ($oldHash -cne $plan.oldBodySha256) { throw 'Release description changed concurrently; refusing to overwrite it.' }
            $json = @{ body = $plan.body } | ConvertTo-Json -Compress
            $null = Invoke-RestMethod -Method Patch -Uri $url -Headers $headers -MaximumRedirection 0 -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($json))
          }
          $after = Invoke-RestMethod -Uri $url -Headers $headers -MaximumRedirection 0
          $tagAfter = Invoke-RestMethod -Uri ($api + '/git/ref/tags/v0.4.0') -Headers $headers -MaximumRedirection 0
          $latest = Invoke-RestMethod -Uri ($api + '/releases/latest') -Headers $headers -MaximumRedirection 0
          $assetAfter = @($after.assets | Sort-Object id | Select-Object id,name,size,digest,state) | ConvertTo-Json -Depth 4 -Compress
          if ($after.body -cne $plan.body -or $after.name -cne $before.name -or $after.tag_name -cne $before.tag_name -or $after.draft -ne $before.draft -or $after.prerelease -ne $before.prerelease -or $assetAfter -cne $assetSnapshot -or $tagAfter.object.sha -cne $plan.targetCommit -or $latest.id -ne $before.id) { throw 'Release update verification failed.' }
          Write-Output ('Updated and verified description: ' + $after.html_url)
