[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["isolation/policy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
repository = "https://github.com/syrrath-creator/SCX-VPad"

[workspace.dependencies]
windows-sys = "0.61"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

